<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vangcur Stack Tower</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF3FE;--muted:#6B7280;--bs:42px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'DM Sans','Hind Siliguri',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;width:min(380px,calc(100% - 16px));height:clamp(480px,calc(100svh - 90px),520px);border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#C3DEFC 0%,#DCEBFD 55%,#fff 100%);box-shadow:0 8px 36px rgba(0,0,0,.13);touch-action:none;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%}
#gl,#fx,#cf{pointer-events:none}#gl{position:absolute;inset:0}
#cf{z-index:9}
/* ── HUD: [fullscreen][sound] ·· [score | best] ·· [close] — এক সারিতে, মাঝের প্যাড সবসময় ঠিক মাঝখানে ── */
#hud{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;z-index:7;pointer-events:none}
#hud>*{pointer-events:auto}
.hg{display:flex;gap:8px;align-items:center}.hg.r{justify-content:flex-end}
.hb,#scorePill{box-sizing:border-box;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(234,243,254,.9));border:1px solid #fff;box-shadow:0 6px 18px rgba(0,88,199,.16),0 1px 0 #fff inset;color:#1A1A1A}
.hb{width:var(--bs);height:var(--bs);border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#44A7FC;transition:transform .15s,box-shadow .2s}
.hb svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hb:hover{box-shadow:0 8px 22px rgba(68,167,252,.38),0 1px 0 #fff inset}
.hb:active{transform:scale(.92)}
.hb:focus-visible{outline:2px solid #44A7FC;outline-offset:2px}
#cl{color:#475569}
#scorePill{height:var(--bs);border-radius:999px;display:flex;align-items:center;gap:9px;padding:0 5px 0 16px}
#score{font-weight:800;font-size:22px;min-width:20px;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.dv{width:1px;height:18px;background:rgba(68,167,252,.45)}
#best{display:flex;align-items:center;gap:5px;height:calc(var(--bs) - 10px);padding:0 11px 0 8px;border-radius:999px;background:linear-gradient(135deg,#FFF3C4,#FFD968);color:#7A4B00;font-weight:800;font-size:13px;box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 2px 6px rgba(214,150,0,.28)}
.tr{width:15px;height:15px;fill:rgba(255,255,255,.55);stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
#hint{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:7px 15px;border-radius:999px;background:rgba(15,40,80,.55);color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap;pointer-events:none;transition:opacity .4s;z-index:4}
#hint.off{opacity:0}
#pop{position:absolute;left:50%;top:20%;font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 12px rgba(0,88,199,.7);white-space:nowrap;pointer-events:none;opacity:0;transform:translateX(-50%)}
#pop.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-36px) scale(1)}}
#glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(68,167,252,0) 55%,rgba(68,167,252,.45) 100%);opacity:0;transition:opacity .5s}
#glow.on{opacity:1;transition:none}
/* গেম-ওভার ওভারলে: ইচ্ছে করেই backdrop-filter (ব্লার) নেই — চলমান ক্যানভাসের ওপর ব্লার ল্যাপটপে ল্যাগের বড় কারণ */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(ellipse at 50% 45%,rgba(195,222,252,.30),rgba(11,30,60,.42));z-index:6;animation:ovIn .35s ease-out}
.ov.hide{display:none}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.card{position:relative;overflow:hidden;width:100%;max-width:340px;text-align:center;padding:24px 20px 14px;border-radius:26px;background:linear-gradient(180deg,#F1F7FF 0%,#DCEBFD 48%,#fff 100%);border:1px solid #fff;box-shadow:0 18px 50px rgba(0,40,100,.30),0 1px 0 #fff inset;color:#1A1A1A;animation:cardIn .5s cubic-bezier(.2,1.2,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
.ttl{margin:0 0 6px;font-size:24px;font-weight:800}
.lbl{font-size:13px;font-weight:700;color:#64748B}
.big{font-size:68px;font-weight:800;color:#0058C7;line-height:1.05;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:999px;background:#fff;border:1px solid rgba(68,167,252,.38);font-weight:800;font-size:13px;color:#334155;box-shadow:0 2px 8px rgba(0,88,199,.08)}
.chip .tr{width:16px;height:16px;color:#D69A00;fill:rgba(255,200,61,.55)}
.btn{position:relative;overflow:hidden;display:block;width:100%;margin-top:16px;background:linear-gradient(90deg,#3B82F6,#44A7FC);color:#fff;border:0;border-radius:999px;padding:13.5px 24px;font:800 15px 'DM Sans','Hind Siliguri',sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(68,167,252,.45);transition:filter .2s,transform .15s}
.btn::after{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-160%) skewX(-18deg);animation:sweep 3.4s ease-in-out 1s infinite;pointer-events:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.97)}
.lnk{display:inline-block;margin-top:8px;padding:8px 12px;background:none;border:0;font:700 12.5px 'DM Sans','Hind Siliguri',sans-serif;color:#44A7FC;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk:hover{color:#3C93DE}
@keyframes sweep{0%{transform:translateX(-160%) skewX(-18deg)}55%,100%{transform:translateX(330%) skewX(-18deg)}}
/* ── নতুন রেকর্ড: সোনালি সেলিব্রেশন ── */
.rbadge,.rtxt{display:none}
.card.rec{background:linear-gradient(180deg,#FFFBEA 0%,#FFF0B8 42%,#fff 100%);box-shadow:0 0 0 2px rgba(255,200,61,.95),0 0 0 7px rgba(255,200,61,.22),0 22px 60px rgba(214,150,0,.40),0 1px 0 #fff inset}
.card.rec::after{content:'';position:absolute;top:0;bottom:0;left:0;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-160%) skewX(-18deg);animation:sweep 3.2s ease-in-out .7s infinite;pointer-events:none}
.card.rec .rbadge{display:block;position:relative;width:92px;height:92px;margin:0 auto 4px;animation:badgeIn .7s cubic-bezier(.2,1.4,.3,1) .1s both}
@keyframes badgeIn{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
.rays{position:absolute;inset:-70px;border-radius:50%;background:repeating-conic-gradient(rgba(255,206,80,.6) 0 9deg,rgba(255,206,80,0) 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 14%,transparent 60%);mask:radial-gradient(circle,#000 14%,transparent 60%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.disc{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#FFF6BE,#FFC83D 55%,#E59A00);box-shadow:0 8px 24px rgba(229,154,0,.55),0 2px 0 rgba(255,255,255,.75) inset;display:flex;align-items:center;justify-content:center;animation:float 2.6s ease-in-out infinite}
.disc svg{width:40px;height:40px;fill:rgba(255,255,255,.55);stroke:#8A5A00;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@keyframes float{50%{transform:translateY(-4px)}}
.sp{position:absolute;width:14px;height:14px;background:#FFC83D;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.6s ease-in-out infinite}
.sp:nth-of-type(1){left:-6px;top:10px}.sp:nth-of-type(2){right:-10px;top:2px;animation-delay:.5s;width:18px;height:18px}.sp:nth-of-type(3){right:-2px;bottom:6px;animation-delay:1s}.sp:nth-of-type(4){left:-14px;bottom:0;animation-delay:.3s;width:10px;height:10px}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.4)}50%{opacity:1;transform:scale(1.15)}}
.card.rec .ttl{font-size:26px;background:linear-gradient(90deg,#B7791F,#F5B301 35%,#FFE27A 50%,#F5B301 65%,#B7791F);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:gshine 2.4s linear infinite}
@keyframes gshine{to{background-position:-200% 0}}
.card.rec .big{background:linear-gradient(180deg,#F8BE1A 10%,#B7791F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.card.rec .rtxt{display:block;margin:-4px 0 12px;font-size:13px;font-weight:700;color:#7A4B00}
.card.rec .chip{border-color:rgba(214,154,0,.45)}
@media (prefers-reduced-motion:reduce){.card,.card *,.btn::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* গেম সবসময় ফোনের মতো একটা লম্বা কলাম। ফোনে পুরো স্ক্রিন; ল্যাপটপ/ডেস্কটপের চওড়া স্ক্রিনে কলামটা মাঝখানে (উপর-নিচ পুরো উচ্চতা),
   আর দুই পাশে শুধু একটা সিঙ্গেল আইস-ব্লু রং — সেখানে কোনো রেন্ডারিং/অ্যানিমেশন নেই। তাই CPU/GPU শুধু মাঝের কলামের পিক্সেলই আঁকে। */
html,body{overflow:hidden;background:var(--bg)}body{display:block}
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:auto;height:auto;border-radius:0;box-shadow:none}
@media (min-aspect-ratio:7/10){
  :root{--gw:min(100vw,clamp(300px,calc(100vh*.5625),520px))}
  #app{left:50%;right:auto;width:var(--gw);margin-left:calc(var(--gw)/-2);box-shadow:0 0 0 1px rgba(68,167,252,.22)}
}
@media (max-width:360px){:root{--bs:38px}#hud{left:10px;right:10px;gap:6px}.hg{gap:6px}}
</style></head>
<body>
<div id="app">
  <canvas id="cv"></canvas><div id="gl"></div><canvas id="fx"></canvas>
  <div id="glow"></div>
  <div id="hud">
    <div class="hg"><button class="hb" id="fs" aria-label="ফুল স্ক্রিন"></button><button class="hb" id="mute" aria-label="সাউন্ড"></button></div>
    <div id="scorePill"><span id="score">0</span><i class="dv"></i><span id="best"><svg class="tr" viewBox="0 0 24 24"><use href="#i-trophy"/></svg><b id="bestN">0</b></span></div>
    <div class="hg r"><button class="hb" id="cl" aria-label="বন্ধ করুন"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  </div>
  <div id="hint">ব্লক ফেলতে স্ক্রিনে ট্যাপ করুন</div>
  <div id="pop"></div>
  <div class="ov hide" id="ovOver"><div class="card" id="card">
    <div class="rbadge"><div class="rays"></div><div class="disc"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg></div><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i></div>
    <h1 class="ttl" id="oTitle">খেলা শেষ</h1>
    <div class="rtxt" id="fRec"></div>
    <div class="lbl" id="oLbl">আপনার স্কোর</div>
    <div class="big" id="fScore">0</div>
    <div class="chip"><svg class="tr" viewBox="0 0 24 24"><use href="#i-trophy"/></svg><span id="fBest"></span></div>
    <button class="btn" id="bAgain">আবার খেলুন</button>
    <button class="lnk" id="bBack">ওয়েটিং পেজে ফিরে যান</button>
  </div></div>
  <canvas id="cf"></canvas>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol></svg>
</div>
<script src="../vendor/three.r128.min.js"></script>
<script>
(()=>{
const $=i=>document.getElementById(i);
const app=$('app'),cv=$('cv'),ctx=cv.getContext('2d'),fx=$('fx'),fctx=fx.getContext('2d'),gl=$('gl'),cf=$('cf'),cctx=cf.getContext('2d');
const KEY='vc_stack_hs',BASE=3,BH=1.5,PH=.45,RANGE=3,TOL=.08,S=1;
let best=0;try{best=+localStorage.getItem(KEY)||0}catch(e){}
let W=0,HT=0,T=0,cam=0,camY=1.9,camT=1.9,AC,MG,PY=30,GO=59,muted=false,renderer,SC=null,LITE=false;
try{renderer=new THREE.WebGLRenderer({antialias:(devicePixelRatio||1)<2,alpha:true,powerPreference:'high-performance'})}catch(e){app.insertAdjacentHTML('beforeend','<div class="ov"><div class="card"><p style="margin:0 0 4px;font-weight:700">এই ডিভাইসে WebGL সাপোর্ট করছে না।</p><button class="btn" onclick="try{parent.postMessage({type:\'vc-game-close\'},location.origin)}catch(e){}">ওয়েটিং পেজে ফিরে যান</button></div></div>');return}
renderer.setClearColor(0,0);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
gl.appendChild(renderer.domElement);renderer.domElement.addEventListener('webglcontextlost',e=>e.preventDefault());
// ধীর ডিভাইস শনাক্ত: সফটওয়্যার রেন্ডারার (GPU নেই) / কম মেমোরি / কম কোর — হলে শুরুতেই হালকা কোয়ালিটি (নিচে setQuality)
let LOW=false;try{const gx=renderer.getContext(),ex=gx.getExtension('WEBGL_debug_renderer_info'),rn=ex?String(gx.getParameter(ex.UNMASKED_RENDERER_WEBGL)):'';
  LOW=/swiftshader|llvmpipe|software|basic render|softpipe/i.test(rn)||(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=2}catch(e){}
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-4.75,4.75,5,-5,.1,200);
let DPRCAP=1.5; // কোয়ালিটি গভর্নর ধীর ডিভাইসে এটা কমিয়ে দেয়
function resize(){const r=app.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,DPRCAP);W=r.width;HT=r.height;
  for(const c of [cv,fx,cf]){c.width=W*d;c.height=HT*d}ctx.setTransform(d,0,0,d,0,0);fctx.setTransform(d,0,0,d,0,0);cctx.setTransform(d,0,0,d,0,0);
  renderer.setPixelRatio(d);renderer.setSize(W,HT);const a=W/HT,hh=Math.max(4.75/a,6.5);camera.top=hh;camera.bottom=-hh;camera.left=-hh*a;camera.right=hh*a;camera.updateProjectionMatrix();PY=HT/(2*hh)*.8165;SC=null}
new ResizeObserver(resize).observe(app);resize();
// lighting: key sun (casts shadows) + sky/ground bounce + cool fill on the +z face
scene.add(new THREE.HemisphereLight(0xeaf4ff,0xa9bfdc,.55));
const sun=new THREE.DirectionalLight(0xfff1de,.85);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:80});sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xb9d8ff,.32);fill.position.set(-4,5,9);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:.28}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const cardTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#c79a66';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=4){g.fillStyle=y%8?'rgba(255,230,190,.07)':'rgba(90,50,10,.07)';g.fillRect(0,y,w,2)}
  for(let i=0;i<2500;i++){g.fillStyle=Math.random()<.5?'rgba(90,55,20,.08)':'rgba(255,235,200,.08)';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}
  const v=g.createRadialGradient(w/2,h/2,w*.3,w/2,h/2,w*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(60,30,0,.24)');g.fillStyle=v;g.fillRect(0,0,w,h)});
const labTex=ctex(256,160,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle='#0058C7';g.fillRect(0,0,w,36);g.fillStyle='#fff';g.font='800 22px DM Sans,sans-serif';g.fillText('VANGCUR',12,26);
  g.fillStyle='#1A1A1A';for(let x=14;x<150;x+=3+Math.random()*4)g.fillRect(x,56,1+Math.random()*2.5,46);g.fillRect(14,114,120,5);g.fillRect(14,126,80,5);
  g.font='700 14px sans-serif';g.fillText('⇧⇧ FRAGILE',150,146);g.fillStyle='#44A7FC';g.fillRect(168,56,68,46)});
const hueD=i=>225+50*Math.sin(i*.14-.37);
const lin=c=>new THREE.Color(c).convertSRGBToLinear();
function disp(g){g.traverse(m=>{if(m.geometry)m.geometry.dispose();if(m.material)m.material.dispose()})}
function mk(w,d,i,lab){ // a delivery parcel: kraft cardboard + brand tape (+ shipping label)
  const g=new THREE.Group(),alongX=i%2===1;
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,BH,d),new THREE.MeshStandardMaterial({map:cardTex,color:new THREE.Color().setHSL(.085+.012*Math.sin(i*.9),.14,.9+.08*Math.sin(i*.6+1)),roughness:.88}));
  const tapeW=alongX?Math.min(.34,Math.max(.12,d*.26)):Math.min(.34,Math.max(.12,w*.26));
  const tg=alongX?new THREE.BoxGeometry(w+.012,BH+.014,tapeW):new THREE.BoxGeometry(tapeW,BH+.014,d+.012);
  const tapeMat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(hueD(i)/360,.68,.58).convertSRGBToLinear(),roughness:.48,metalness:.015});
  const tape=new THREE.Mesh(tg,tapeMat); tape.castShadow=true; tape.receiveShadow=true;
  for(const m of [body,tape]){m.castShadow=m.receiveShadow=true;g.add(m)}
  if(lab&&w>1.3&&d>1.3){const L=new THREE.Mesh(new THREE.PlaneGeometry(1.15,.75),new THREE.MeshStandardMaterial({map:labTex,roughness:.6}));
    if(alongX)L.position.set(-w*.2,.02,d/2+.004);else{L.position.set(w/2+.004,.02,-d*.2);L.rotation.y=Math.PI/2}g.add(L)}
  scene.add(g);return g}

  const mp=(g,j,w,d)=>({g,w,d,t:0,pile:true,delay:(n-j)*dl,vx:(Math.random()-.5)*2.4+(a==='x'?out*(1.25+j*.035):0),vz:(Math.random()-.5)*2.4+(a==='z'?out*(1.25+j*.035):0),vy:-.5-j*.18,wx:(Math.random()-.5)*4.2,wz:(Math.random()-.5)*4.2});
  for(let j=1;j<n;j++){const b=blocks[j];b.g.visible=true;debris.push(mp(b.g,j,b.w,b.d))}
  debris.push(mp(g,n,w,d));shake=.5}
function toDeb(g,a,out){return{g,a,out,t:0,vy:.7,s:out*(1.1+Math.random()*.8),wz:out*(2.5+Math.random()*2.5),wo:(Math.random()-.5)*3}}
function slice(l,r,out){const a=cur.a,g=mk(a==='x'?r-l:cur.w,a==='z'?r-l:cur.d,cur.i,0);g.position.set(a==='x'?(l+r)/2:cur.x,cur.y,a==='z'?(l+r)/2:cur.z);return toDeb(g,a,out)}
function place(){
  hideHint();
  const t=blocks[blocks.length-1],a=cur.a,s=t[a==='x'?'w':'d'],dl=cur[a]-t[a],ad=Math.abs(dl),out=dl>=0?1:-1,i=cur.i;
  if(ad>=s){collapse(cur.g,a,out,cur.w,cur.d);cur=null;noise(.5,.08);gameOver();return}
  let nw=cur.w,nd=cur.d,nc=cur[a];const perf=ad<=TOL;
  if(perf){nc=t[a];combo++;if(combo>=3){if(a==='x')nw=Math.min(BASE,nw+.12);else nd=Math.min(BASE,nd+.12)}}
  else{combo=0;const lo=Math.max(cur[a]-s/2,t[a]-s/2),hi=Math.min(cur[a]+s/2,t[a]+s/2);
    debris.push(dl>0?slice(hi,cur[a]+s/2,1):slice(cur[a]-s/2,lo,-1));nc=(lo+hi)/2;if(a==='x')nw=hi-lo;else nd=hi-lo}
  const x=a==='x'?nc:cur.x,z=a==='z'?nc:cur.z,top=cur.y+BH/2;
  scene.remove(cur.g);disp(cur.g);const g=mk(nw,nd,i,1);g.position.set(x,cur.y,z);blocks.push({x,z,w:nw,d:nd,top,g});
  landings.push({g,t:0,baseY:cur.y});
  if(blocks.length>14)blocks[blocks.length-14].g.visible=false;
  score++;
  if(perf){ring={x,z,w:nw,d:nd,y:top,t:0};noise(.16,.028);pop('PERFECT! ✨'+(combo>1?' x'+combo:''));const f=523*Math.pow(2,[0,2,4,7,9,12][Math.min(combo-1,5)]/12);
    snd(f,.35,'sine',.14);snd(f*2,.25,'triangle',.05);snd(f*3,.2,'sine',.03);thud();spark(x,top,z,14,'#bfe9ff',1);const gl2=$('glow');gl2.classList.add('on');setTimeout(()=>gl2.classList.remove('on'),120);navigator.vibrate&&navigator.vibrate(12)}
  else{const p=debris[debris.length-1].g.position;spark(p.x,p.y+BH/2,p.z,10,'#8fb3e0',2);thud();noise(.18,.03)}
  if(MS[score])setTimeout(()=>{pop(MS[score]);snd(1175,.3,'sine',.1);noise(.18,.022)},450);
  spawn();hud()}
function showOver(){if(st!=='over'||overShown)return;
  const rec=score>prevBest&&score>0,card=$('card');
  card.classList.remove('rec');void card.offsetWidth; // অ্যানিমেশন প্রতিবার নতুন করে চালু
  card.classList.toggle('rec',rec);
  $('oTitle').textContent=rec?TX.rec:TX.over;
  $('fBest').textContent=TX.best+best;
  $('fRec').textContent=rec?(prevBest>0?TX.beat+prevBest:TX.first):'';
  $('ovOver').classList.remove('hide');overShown=true;overAt=performance.now();
  if(rec){countUp($('fScore'),score,900);celebrate();fanfare()}else $('fScore').textContent=score}
function gameOver(){
  st='over';shake=.3;prevBest=best;
  if(score>best){best=score;try{localStorage.setItem(KEY,best)}catch(e){}}
  hud();navigator.vibrate&&navigator.vibrate(40);
  pendingOver=true;
}
function act(){
  if(st==='playing')place();else if(st==='ready')start();
  else if(st==='over'&&overShown&&performance.now()-overAt>700)start();
}

function update(dt){
  if(cur&&(st==='ready'||st==='playing')){const a=cur.a;cur[a]+=speed*cur.dir*dt;
    if(cur[a]>RANGE){cur[a]=RANGE;cur.dir=-1}else if(cur[a]<-RANGE){cur[a]=-RANGE;cur.dir=1}cur.g.position[a]=cur[a];
    if(cur.intro<1){cur.intro=Math.min(1,cur.intro+dt/.2);const e=1-Math.pow(1-cur.intro,3);cur.g.position.y=cur.y+(1-e)*.8;cur.g.scale.setScalar(.88+.12*e)} /* হঠাৎ উদয় নয় — ওপর থেকে নরমভাবে নামে */
  }
  if(st==='over'&&colT<9){colT+=dt;camT=1.9+(colC-1.9)*Math.max(0,1-colT/colDur)}
  camY+=(camT-camY)*Math.min(1,dt*(st==="over"?6:4));
  if(pendingOver&&st==='over'&&colT>colEnd&&Math.abs(camY-camT)<.08){pendingOver=false;showOver()}cam=camY*38;if(!LITE){birdsUpdate(dt);leavesUpdate(dt)}
  for(const l of landings){l.t+=dt;const q=Math.min(1,l.t/.18);const ease=1-Math.pow(1-q,3);l.g.position.y=l.baseY+Math.sin(q*Math.PI)*.055*(1-q);l.g.scale.setScalar(1+.018*Math.sin(q*Math.PI));}
  landings=landings.filter(l=>l.t<.24);
  for(const d of debris){d.t+=dt;const p=d.g.position;
    if(d.pile){if(d.t<d.delay)continue;d.vy-=26*dt;p.x+=d.vx*dt;p.y+=d.vy*dt;p.z+=d.vz*dt;const q=d.g.rotation;q.x+=d.wx*dt;q.z+=d.wz*dt;
      const ext=BH/2*Math.max(Math.abs(Math.cos(q.x)),Math.abs(Math.cos(q.z)))+d.w/2*Math.abs(Math.sin(q.z))+d.d/2*Math.abs(Math.sin(q.x)),fl=(Math.abs(p.x)<1.9&&Math.abs(p.z)<1.9)?PH:0;
      if(p.y-ext<fl){if(d.vy<-4&&!d.hit){d.hit=1;spark(p.x,fl,p.z,8,'#c9d6e6',2);hitSnd()}
        p.y=fl+ext;d.vy=Math.abs(d.vy)>2?-d.vy*.2:0;d.vx*=.55;d.vz*=.55;d.wx*=.45;d.wz*=.45}
      continue}
    d.vy-=26*dt;p.y+=d.vy*dt;p[d.a]+=d.s*dt;const R=d.g.rotation;if(d.a==='x'){R.z-=d.wz*dt*.6;R.x+=d.wo*dt}else{R.x+=d.wz*dt*.6;R.z+=d.wo*dt}}
  debris=debris.filter(d=>{if(!d.pile&&(d.g.position.y<camY-16||d.t>5)){scene.remove(d.g);disp(d.g);return false}return true});
  if(ring){ring.t+=dt*2.4;if(ring.t>1)ring=null}
  for(const p of parts){p.t+=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt}
  parts=parts.filter(p=>p.t<(p.L||3)&&p.y<HT+20);
  if(shake>0)shake-=dt;
}
function render(){
  const sh=shake>0?(Math.random()-.5)*Math.min(.55,shake*1.15):0;
  camera.position.set(30+sh,camY+30+sh,30);camera.lookAt(0,camY,0);camera.updateMatrixWorld();GO=pr(0,0,0)[1]-HT/2;
  ctx.clearRect(0,0,W,HT);bg();
  fctx.clearRect(0,0,W,HT);front();
  sun.position.set(7,camY+12,-2);sun.target.position.set(0,camY,0);
  renderer.render(scene,camera);
  if(ring){const r=ring,k=1+r.t*.5,pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(p=>pr(r.x+p[0]*r.w/2*k,r.y,r.z+p[1]*r.d/2*k));
    fctx.beginPath();pts.forEach((p,i)=>i?fctx.lineTo(p[0],p[1]):fctx.moveTo(p[0],p[1]));fctx.closePath();
    fctx.strokeStyle=`rgba(255,255,255,${1-r.t})`;fctx.lineWidth=3;fctx.stroke();fctx.strokeStyle=`rgba(68,167,252,${.4*(1-r.t)})`;fctx.lineWidth=8;fctx.stroke()}
  for(const p of parts){const L=p.L||3;fctx.save();fctx.translate(p.x,p.y);fctx.globalAlpha=Math.max(0,1-p.t/L)*(p.k===2?.55:1);fctx.fillStyle=p.c;
    if(p.k){if(p.k===1){fctx.globalAlpha*=.3;fctx.beginPath();fctx.arc(0,0,p.s*1.3,0,7);fctx.fill();fctx.globalAlpha/=.3}fctx.beginPath();fctx.arc(0,0,p.s*.55,0,7);fctx.fill()}
    else{fctx.rotate(p.r);fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}fctx.restore()}
}
// ⚙️ কোয়ালিটি গভর্নর: ফ্রেম টাইম লম্বা হলে (ল্যাপটপ/ধীর GPU) নিজে থেকে ধাপে ধাপে রেজোলিউশন ও শ্যাডো কমায়।
// ফোন/শক্তিশালী ডিভাইসে এটা কিছুই বদলায় না। ধাপ: ১) রেজোলিউশন ≤১.২৫ + শ্যাডো ১০২৪  ২) রেজোলিউশন ১ + শ্যাডো ৫১২  ৩) শ্যাডো বন্ধ
let qLvl=0,qAcc=0,qN=0,qCool=90,lastRaw=0;
function setQuality(l){qLvl=l;LITE=l>=2; // LITE: মেঘ কম, পাখি/পাতা/প্রজাপতি বন্ধ
  if(l>=1)DPRCAP=l>=2?1:1.25;
  if(l===1){sun.shadow.mapSize.set(768,768);renderer.shadowMap.type=THREE.PCFShadowMap}
  if(l===2){sun.shadow.mapSize.set(512,512);renderer.shadowMap.type=THREE.BasicShadowMap}
  if(l>=3)renderer.shadowMap.enabled=false;
  if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}
  scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});
  resize()}
function governor(raw){ // raw = আসল ফ্রেম-ব্যবধান (সেকেন্ড)
  if(qLvl>=3||document.hidden)return;if(raw>.25){qAcc=0;qN=0;return} // ট্যাব-সুইচ/পজ বাদ
  if(qCool>0){qCool--;return}
  qAcc+=raw;qN++;
  if(qN>=30){const avg=qAcc/qN;qAcc=0;qN=0;if(avg>.024){setQuality(qLvl+1);qCool=45}}}
let last=0;
function frame(t){T=t/1000;const raw=(t-lastRaw)/1000||0;lastRaw=t;governor(raw);const dt=Math.min((t-last)/1000||0,1/20);last=t;update(dt);render();confStep(dt);requestAnimationFrame(frame)}

  max:SV('<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>'),

// window.innerHeight স্ক্রিনের উচ্চতার কাছাকাছি মানে প্যারেন্টের ফুলস্ক্রিন ইতিমধ্যে সফল হয়েছে — তখন কিছু দেখানো হয় না।
function looksFullscreen(){try{return (screen.height-window.innerHeight)<60||!!(document.fullscreenElement||document.webkitFullscreenElement)}catch(e){return true}}
if(matchMedia('(pointer:coarse)').matches){
  setTimeout(()=>{
    if(looksFullscreen()||!$('fs')||$('fs').style.display==='none')return;
    const tip=document.createElement('div');tip.id='fsHint';
    tip.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg><span>'+(EN?'Tap for fullscreen':'ফুল স্ক্রিনে যেতে এখানে ট্যাপ করুন')+'</span>';
    tip.style.cssText='position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px) + var(--bs) + 10px);display:flex;align-items:center;gap:6px;padding:7px 13px 7px 10px;border-radius:999px;background:rgba(15,40,80,.72);color:#fff;font:700 11.5px "DM Sans","Hind Siliguri",sans-serif;white-space:nowrap;z-index:8;pointer-events:none;animation:fsBob 1.1s ease-in-out infinite';
    const kf=document.createElement('style');kf.textContent='@keyframes fsBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}';document.head.appendChild(kf);
    app.appendChild(tip);
    const kill=()=>{tip.remove()};

  },1200);
}
